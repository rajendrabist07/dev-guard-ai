name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_baseline:
        description: 'Update and promote current eval scores as new baseline'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-verify:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Vitest Suites
        run: npm test

      - name: Verify Data Consistency Invariants
        run: npm run test:consistency
        env:
          NEXT_PUBLIC_GITHUB_APP_INSTALL_URL: 'https://github.com/apps/devguard-agent/installations/new'

      - name: Verify Badge & Report Suites
        run: |
          npm run test:badge
          npm run test:reports
          npm run test:transparency

      - name: Run CI Evaluation Regression Gate
        id: eval-gate
        run: npm run eval:gate

      - name: Generate PR Evaluation Comment Markdown
        if: always() && github.event_name == 'pull_request'
        run: npx tsx evals/generate-pr-comment.ts

      - name: Post Evaluation Results as PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const commentFile = path.join(process.cwd(), 'evals', 'pr-comment.md');
            if (fs.existsSync(commentFile)) {
              const body = fs.readFileSync(commentFile, 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(c => c.body.includes('DevGuard AI — Automated CI Evaluation Benchmark'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            }

      - name: Promote Baseline (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_baseline == 'true'
        run: |
          npm run eval:promote
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add evals/baseline.json
          git commit -m "chore(evals): promote verified evaluation scores as new baseline [skip ci]" || echo "No baseline changes to commit"
          git push

      - name: Run Production Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_GITHUB_APP_INSTALL_URL: 'https://github.com/apps/devguard-agent/installations/new'
