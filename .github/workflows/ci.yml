name: DevGuard CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_baseline:
        description: 'Update and promote current eval scores as new baseline'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Typecheck and Lint
  # ---------------------------------------------------------------------------
  typecheck-and-lint:
    name: Typecheck & ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 2. Unit Tests & Enforced Coverage (>= 85% Lines)
  # ---------------------------------------------------------------------------
  unit-coverage:
    name: Vitest Unit Suite (>= 85% Line Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest with Line Coverage Enforced
        run: npm run test:coverage
        env:
          NEXT_PUBLIC_GITHUB_APP_INSTALL_URL: 'https://github.com/apps/devguard-agent/installations/new'

      - name: Verify Data Consistency & Reporting Invariants
        run: |
          npm run test:consistency
          npm run test:badge
          npm run test:reports
          npm run test:transparency
        env:
          NEXT_PUBLIC_GITHUB_APP_INSTALL_URL: 'https://github.com/apps/devguard-agent/installations/new'

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: vitest-coverage-report
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Integration Tests
  # ---------------------------------------------------------------------------
  integration:
    name: API & Webhook Integration Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration Tests
        run: npx vitest run __tests__/integration

  # ---------------------------------------------------------------------------
  # 4. Evaluation Benchmark Gate
  # ---------------------------------------------------------------------------
  eval-gate:
    name: Model Evaluation Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run CI Evaluation Regression Gate
        id: eval-gate
        run: npm run eval:gate

      - name: Generate PR Evaluation Comment Markdown
        if: always() && github.event_name == 'pull_request'
        run: npx tsx evals/generate-pr-comment.ts

      - name: Post Evaluation Results as PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const commentFile = path.join(process.cwd(), 'evals', 'pr-comment.md');
            if (fs.existsSync(commentFile)) {
              const body = fs.readFileSync(commentFile, 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(c => c.body.includes('DevGuard AI — Automated CI Evaluation Benchmark'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            }

      - name: Promote Baseline (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_baseline == 'true'
        run: |
          npm run eval:promote
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add evals/benchmark-baseline.json
          git commit -m "chore(evals): promote new benchmark evaluation baseline [skip ci]" || echo "No changes to baseline"
          git push origin main || echo "Nothing to push"

  # ---------------------------------------------------------------------------
  # 5. Security Audit & Secret Scanning
  # ---------------------------------------------------------------------------
  security-audit:
    name: NPM Audit & Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Check for High/Critical Vulnerabilities
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # 6. Production Next.js Build
  # ---------------------------------------------------------------------------
  build:
    name: Next.js Production Build
    needs: [typecheck-and-lint, unit-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: 'https://dev-guard-ai.vercel.app'
          NEXT_PUBLIC_GITHUB_APP_INSTALL_URL: 'https://github.com/apps/devguard-agent/installations/new'

  # ---------------------------------------------------------------------------
  # 7. Playwright E2E & WCAG Accessibility
  # ---------------------------------------------------------------------------
  e2e:
    name: Playwright E2E & WCAG AA Audit
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Application for E2E
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          NEXT_PUBLIC_GITHUB_APP_INSTALL_URL: 'https://github.com/apps/devguard-agent/installations/new'

      - name: Run Playwright Tests (Desktop + Mobile)
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
